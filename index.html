    <style>
        :root {
            --bg-primary: #f4f4f5;
            --bg-secondary: #fafaf9;
            --text-primary: #18181b;
            --text-secondary: #64748b;
            --accent-primary: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border-color: #e2e8f0;
            --chart-bg: #e0f2fe;
            --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --sidebar-width: 280px;

            --banner-bg: linear-gradient(135deg, #fffbeb, #f0f9ff);
            --banner-header: #c2410c;
            --banner-title: #1e3a8a;
            --banner-desc: #334155;
            --banner-label-bg: #0369a1;
            --banner-accent: #b45309;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-primary: #3b82f6;
            --accent-hover: #60a5fa;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --border-color: #334155;
            --chart-bg: #1e3a8a;
            --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5);

            --banner-bg: linear-gradient(135deg, #1e293b, #0f172a);
            --banner-header: #fbbf24;
            --banner-title: #f8fafc;
            --banner-desc: #cbd5e1;
            --banner-label-bg: #38bdf8;
            --banner-accent: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .hidden {
            display: none !important;
        }

        .flex {
            display: flex;
        }

        .flex-col {
            flex-direction: column;
        }

        .items-center {
            align-items: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .gap-4 {
            gap: 1rem;
        }

        .p-4 {
            padding: 1rem;
        }

        .p-6 {
            padding: 1.5rem;
        }

        .rounded {
            border-radius: 0.5rem;
        }

        .font-bold {
            font-weight: 700;
        }

        .text-sm {
            font-size: 0.875rem;
        }

        .text-xl {
            font-size: 1.25rem;
        }

        .text-accent {
            color: var(--accent-primary);
        }

        .w-full {
            width: 100%;
        }

        .btn {
            padding: 0.5rem 1.25rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            outline: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        #sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            height: 100%;
            z-index: 50;
        }

        .logo-area {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 0.75rem;
            margin-bottom: 0.25rem;
            cursor: pointer;
            font-weight: 500;
        }

        .nav-link:hover,
        .nav-link.active {
            background-color: var(--bg-primary);
            color: var(--accent-primary);
            font-weight: 700;
        }

        #main-content {
            flex: 1;
            padding: 2.5rem;
            overflow-y: auto;
        }

        .card {
            background-color: var(--bg-secondary);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            margin-bottom: 1.5rem;
        }

        .motivational-quote {
            background: var(--banner-bg);
            padding: 1.5rem;
            border-radius: 1.25rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .quote-text {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--banner-title);
        }

        .category-badge {
            background: var(--banner-label-bg);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .type-label {
            background: var(--banner-accent);
            color: white;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 0.65rem;
            font-weight: 800;
            margin-bottom: 8px;
            display: inline-block;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .accordion-item {
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            border-radius: 0.75rem;
            margin-bottom: 0.75rem;
            overflow: hidden;
        }

        .accordion-header {
            padding: 1.25rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            background: var(--bg-primary);
        }

        .accordion-content {
            padding: 0 1.25rem;
            max-height: 0;
            overflow: hidden;
            transition: 0.4s ease-out;
        }

        .accordion-item.open .accordion-content {
            max-height: 1500px;
            padding: 1.25rem;
        }

        .weight-badge {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 5px;
            text-transform: uppercase;
        }

        .weight-high {
            background: #fee2e2;
            color: #991b1b;
        }

        .weight-medium {
            background: #fef3c7;
            color: #92400e;
        }

        #setup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-primary);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .setup-container {
            background: var(--bg-secondary);
            width: 100%;
            max-width: 600px;
            border-radius: 1.5rem;
            padding: 3rem;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 0.85rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
            font-size: 1rem;
        }

        #mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            z-index: 100;
            justify-content: space-around;
            padding: 0.5rem 0;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.05);
        }

        #mobile-nav .nav-link {
            flex-direction: column;
            gap: 4px;
            font-size: 10px;
            padding: 8px 4px;
            margin: 0;
            border-radius: 0;
            text-align: center;
            min-width: 60px;
        }

        #mobile-nav .nav-link span {
            font-size: 18px;
        }

        @media (max-width: 768px) {
            #sidebar {
                display: none !important;
            }

            #mobile-nav {
                display: flex;
            }

            #main-content {
                padding: 1rem !important;
                margin-bottom: 75px !important;
            }

            .grid-3 {
                grid-template-columns: 1fr !important;
            }

            .motivational-quote {
                padding: 1rem;
            }

            .quote-text {
                font-size: 0.95rem;
            }

            .setup-container {
                padding: 1.5rem;
                margin: 10px;
            }

            header h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

    <nav id="sidebar">

    <div id="setup-overlay" class="hidden">

            <!-- Auth Selection -->
            <div id="auth-selector" class="flex gap-4 mb-8">
                <button class="btn btn-primary flex-1" id="btn-signup-view" onclick="UI.toggleAuth(false)">New
                    Aspirant</button>
                <button class="btn btn-outline flex-1" id="btn-login-view" onclick="UI.toggleAuth(true)">Existing
                    User</button>
            </div>

            <!-- Login Flow -->
            <div id="login-flow" class="hidden">
                <div class="form-group"><label class="form-label">Email Address</label><input type="email"
                        id="login-email" class="form-input" placeholder="you@example.com"></div>
                <div class="form-group"><label class="form-label">Password</label><input type="password"
                        id="login-password" class="form-input" placeholder="••••••••"></div>
                <button class="btn btn-primary w-full" onclick="Auth.loginProc()">Log Into Cloud</button>
            </div>

            <!-- Signup/Setup Flow -->
            <form id="setup-form">
                <div class="form-group"><label class="form-label">Full Name</label><input type="text" id="setup-name"
                        class="form-input" required placeholder="Enter your name"></div>
                <div class="flex gap-4">
                    <div class="form-group w-full"><label class="form-label">Target Year</label><select id="setup-year"
                            class="form-select">
                            <option>2026</option>
                            <option>2027</option>
                            <option>2028</option>
                            <option>2029</option>
                            <option>2030</option>
                        </select></div>
                    <div class="form-group w-full"><label class="form-label">Daily Study Goal (Hours)</label><input
                            type="number" id="setup-hours" class="form-input" value="8" min="4" max="16"></div>
                </div>

                <div
                    style="padding:1.5rem; background:rgba(0,0,0,0.02); border-radius:12px; border:1px dashed var(--border-color); margin-bottom:1.5rem;">
                    <div id="cloud-fields">
                        <p class="text-[10px] text-secondary mb-2 uppercase font-bold text-center">Secure Your Data
                            (Optional)</p>
                        <input type="email" id="setup-email" class="form-input mb-3"
                            placeholder="Email (Leave blank for local-only)">
                        <input type="password" id="setup-password" class="form-input"
                            placeholder="Password (Leave blank for local-only)">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-full">Start Personalized Prep</button>
            </form>
        </div>
    </div>

            syllabus: () => {
                UI.setActiveNav('syllabus');
                const prog = Store.get('upsc_progress') || {}, mode = window.syllabusMode || 'prelims';
                let html = `<div class="flex justify-between items-center mb-8"><h1>Syllabus</h1><div class="flex gap-2"><button class="btn ${mode === 'prelims' ? 'btn-primary' : ''}" onclick="window.syllabusMode='prelims'; Render.syllabus()">Prelims</button><button class="btn ${mode === 'mains' ? 'btn-primary' : ''}" onclick="window.syllabusMode='mains'; Render.syllabus()">Mains</button></div></div>`;
                SYLLABUS_DB[mode].forEach(sub => {
                    let done = 0, total = 0; sub.chapters.forEach(c => c.topics.forEach(t => { total++; if (prog[t.id]) done++; }));
                    const pct = total ? Math.round((done / total) * 100) : 0;
                    html += `<div class="card p-0 mb-4 overflow-hidden"><div class="p-4 flex justify-between items-center bg-primary" style="cursor:pointer" onclick="this.nextElementSibling.classList.toggle('hidden')"><div><b>${sub.name}</b> <small>${done}/${total}</small></div><b>${pct}%</b></div><div class="p-4 hidden">${sub.chapters.map(c => `<div class="mb-4"><b>${c.name}</b>${c.topics.map(t => `<div class="p-2 border-b flex justify-between items-center"><span class="text-sm">${t.name}</span><input type="checkbox" ${prog[t.id] ? 'checked' : ''} onclick="Actions.toggleTask('${t.id}', this.checked); Render.syllabus()"></div>`).join('')}</div>`).join('')}</div></div>`;
                });
                document.getElementById('main-content').innerHTML = html;
            },
            planner: () => {
                UI.setActiveNav('planner');
                const plan = Store.get('upsc_plan'), today = new Date().toISOString().split('T')[0], isWeekly = window.showWeeklyView || false;
                let html = `<div class="flex justify-between items-center mb-6"><h1>Strategy</h1><div><button class="btn text-xs mr-2" onclick="window.showWeeklyView=false; Render.planner()">Today</button><button class="btn text-xs" onclick="window.showWeeklyView=true; Render.planner()">Weekly</button></div></div>`;
                if (!plan) html += `<div class="card text-center p-10"><button class="btn btn-primary" onclick="PlannerEngine.generate()">Generate Plan</button></div>`;
                else {
                    const tasks = plan[today] || [];
                    html += `<div class="card"><h3>${isWeekly ? 'Weekly Overview' : 'Today (Syllabus)'}</h3><div class="mt-4">${tasks.map(t => `<div class="p-3 mb-2 border rounded flex justify-between bg-secondary"><span>${t.name}</span><input type="checkbox" onclick="Actions.toggleTask('${t.id}', this.checked); Render.planner()"></div>`).join('')}</div></div>`;
                }
                document.getElementById('main-content').innerHTML = html;
            },
            questions: (offset = 0) => {
                UI.setActiveNav('questions');
                const mcqs = window.QuestionService.getMCQs(10, offset);
                document.getElementById('main-content').innerHTML = `<div class="card"><h1>Question Bank</h1><div class="mt-6">${mcqs.map(q => `<div class="p-4 border-b"><b>${q.q}</b><div class="flex gap-2 mt-2">${q.options.map(o => `<button class="btn btn-outline text-xs">${o}</button>`).join('')}</div></div>`).join('')}</div><div class="mt-6 flex gap-4"><button class="btn btn-outline" onclick="Render.questions(${offset - 10})">Prev</button><button class="btn btn-primary" onclick="Render.questions(${offset + 10})">Next</button></div></div>`;
            },
            books: () => { Render.editorial(); } // Shortcut
        };

        const Actions = {
            toggleTask: (tid, check) => {
                const p = Store.get('upsc_progress') || {}; p[tid] = check;
                Store.set('upsc_progress', p);
            },
            calculateProgress: () => {
                const p = Store.get('upsc_progress') || {};
                let total = 0, done = 0;
                [...SYLLABUS_DB.prelims, ...SYLLABUS_DB.mains].forEach(s => {
                    s.chapters.forEach(ch => { total += ch.topics.length; ch.topics.forEach(t => { if (p[t.id]) done++; }); });
                });
                return total ? Math.round((done / total) * 100) : 0;
            },
            startTimer: () => {
                let s = 1500; const clock = document.getElementById('pomo-clock'); if (!clock) return;
                const itv = setInterval(() => {
                    s--; if (s <= 0) { clearInterval(itv); alert("Done!"); clock.innerText = "25:00"; return; }
                    clock.innerText = `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;
                }, 1000);
            },
            toggleTheme: () => document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'),
            checkMcq: (opt, btn) => {
                const q = window.currentMcq; if (opt === q.ans) { btn.className = "btn btn-primary w-full text-xs mt-2"; alert("Correct!"); }
                else { btn.className = "btn btn-danger w-full text-xs mt-2"; alert("Correct was: " + q.ans); }
            }
        };

        const UI = {
            toggleAuth: (login) => {
                document.getElementById('login-flow').classList.toggle('hidden', !login);
                document.getElementById('setup-form').classList.toggle('hidden', login);
                document.getElementById('setup-title').innerText = login ? "Welcome Back" : "Begin Your Journey";
            },
            closeSetup: () => document.getElementById('setup-overlay').classList.add('hidden'),
            setActiveNav: (id) => {
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                document.getElementById('nav-' + id)?.classList.add('active');
                document.getElementById('mob-nav-' + id)?.classList.add('active');
                // Auto-scroll to top on navigation
                document.getElementById('main-content').scrollTop = 0;
            }
        };

        Store.init();
    </script>
</body>

</html>

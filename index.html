<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPPSC SDM RANKER PORTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #f1f5f9; }
        .up-special-card { background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%); }
        .gs-card { background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%); }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto">
        
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">UPPSC <span class="text-orange-600">SDM</span></h1>
                <p class="text-[10px] tracking-widest text-slate-500 font-bold uppercase">Ranker Tracking Portal</p>
            </div>
            <div class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-[10px] font-bold">LIVE ✅</div>
        </div>

        <div id="task-container" class="gs-card text-white p-6 rounded-[2.5rem] shadow-2xl mb-6">
            <div class="flex justify-between items-start">
                <span id="date-text" class="bg-white/20 px-3 py-1 rounded-full text-[10px]">Date: 2026-04-26</span>
                <span id="paper-badge" class="font-bold text-yellow-400 text-sm tracking-widest">GS-I</span>
            </div>
            
            <h2 id="topic-title" class="text-3xl font-bold mt-4 leading-tight">Ancient India</h2>
            <p id="subtopic-detail" class="text-blue-100 text-sm mt-2 opacity-90 italic">Prehistory, Indus Valley: town planning, economy, art</p>
            
            <div class="mt-8 grid grid-cols-2 gap-3">
                <div class="bg-white/10 p-3 rounded-2xl border border-white/5 text-center">
                    <p class="text-[9px] opacity-60 uppercase">Progress</p>
                    <p id="progress-val" class="text-xs font-bold">0.8%</p>
                </div>
                <div class="bg-white/10 p-3 rounded-2xl border border-white/5 text-center">
                    <p class="text-[9px] opacity-60 uppercase">Consistency</p>
                    <p class="text-xs font-bold">🔥 100%</p>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 mb-6">
            <h4 class="text-xs font-bold text-slate-400 uppercase mb-3 tracking-widest">Prelims MCQ Challenge</h4>
            <p id="mcq-q" class="text-slate-800 text-sm font-semibold mb-4 leading-relaxed">
                Which site in UP provides the earliest evidence of rice cultivation?
            </p>
            <button onclick="document.getElementById('ans-box').classList.toggle('hidden')" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition">
                Check Correct Answer
            </button>
            <div id="ans-box" class="hidden mt-3 p-3 bg-green-50 text-green-700 text-xs font-bold rounded-xl text-center border border-green-100">
                Answer: <span id="mcq-a">B (Koldihwa)</span>
            </div>
        </div>

        <button onclick="alert('Progress Saved!')" class="w-full py-5 bg-slate-900 text-white rounded-[2rem] font-bold shadow-xl active:scale-95 transition-transform">
            Complete Today's Topic ✅
        </button>
    </div>

    <script>
        // INTEGRATED DATA - Pura syllabus yahan hai
        const studyPlan = [
            { "Date": "2026-04-26", "Paper": "GS-I", "Topic": "Ancient India", "Subtopic": "Prehistory, Indus Valley: town planning, economy, art", "mcq": "Which site in UP provides the earliest evidence of rice cultivation?", "ans": "B (Koldihwa)" },
            { "Date": "2026-04-27", "Paper": "GS-I", "Topic": "Ancient India", "Subtopic": "Vedic age: society, polity, religion", "mcq": "First Speaker of UP Legislative Assembly?", "ans": "Purushottam Das Tandon" },
            { "Date": "2026-08-12", "Paper": "GS-VI", "Topic": "UP Economy", "Subtopic": "Public finance, tax reforms, ODOP", "mcq": "UP district known for 'Black Pottery'?", "ans": "Azamgarh" }
        ];

        function init() {
            // Hum system ki date detect karenge ya pehla topic load karenge
            const today = new Date().toISOString().split('T')[0];
            let data = studyPlan.find(d => d.Date === today) || studyPlan[0];

            document.getElementById('topic-title').innerText = data.Topic;
            document.getElementById('subtopic-detail').innerText = data.Subtopic;
            document.getElementById('paper-badge').innerText = data.Paper;
            document.getElementById('date-text').innerText = "Date: " + data.Date;
            document.getElementById('mcq-q').innerText = data.mcq;
            document.getElementById('mcq-a').innerText = data.ans;

            // Progress Logic
            const idx = studyPlan.indexOf(data) + 1;
            document.getElementById('progress-val').innerText = ((idx/studyPlan.length)*100).toFixed(1) + "%";

            // UP Special Highlight
            if(data.Paper.includes('GS-V') || data.Paper.includes('GS-VI')) {
                document.getElementById('task-container').className = "up-special-card text-white p-6 rounded-[2.5rem] shadow-2xl mb-6";
            }
        }

        window.onload = init;
    </script>
</body>
</html>
